services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Buzón de correo falso para desarrollo: los correos de NOVA se ven en http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "8025:8025"

  # Modelo de IA local. Se activa con COMPOSE_PROFILES=ollama en el .env.
  # Con GPU NVIDIA arranca también con docker-compose.gpu.yml (ver README).
  ollama:
    image: ollama/ollama:0.6.8
    profiles: ["ollama"]
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      OLLAMA_KEEP_ALIVE: 24h
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  # Descarga los modelos la primera vez (tarda varios minutos) y termina.
  ollama-pull:
    image: ollama/ollama:0.6.8
    profiles: ["ollama"]
    restart: "no"
    environment:
      OLLAMA_HOST: ollama:11434
      OLLAMA_PULL_MODELS: ${OLLAMA_PULL_MODELS:-qwen2.5:3b bge-m3}
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; for m in $$OLLAMA_PULL_MODELS; do ollama pull $$m; done"]
    depends_on:
      - ollama

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  mysql-data:
  ollama-data:
